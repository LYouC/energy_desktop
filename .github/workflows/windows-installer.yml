name: Windows installer

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag points to a commit on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The tagged commit must be part of main.'
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm exec --no -- install-electron
      - run: npm run test:desktop
      - run: npm run pack:installer
      - run: node tests/pack.smoke.mjs

      - name: Upload the Windows x64 installer
        uses: actions/upload-artifact@v7
        with:
          name: xixu-windows-x64-installer
          path: release/xixu-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
